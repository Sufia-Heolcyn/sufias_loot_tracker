name: Foundry VTT Module Release

on:
  release:
    types: [published, edited]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-attach:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync module.json version and download URL with Release Tag
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          jq --arg v "$TAG" \
             --arg dl "https://github.com/${{ github.repository }}/releases/download/${TAG}/module.zip" \
             '.version = $v | .download = $dl' module.json > module.json.tmp && mv module.json.tmp module.json

      - name: Package Foundry Module ZIP
        run: |
          zip -r module.zip module.json LICENSE README.md scripts styles templates lang

      - name: Upload module.json and module.zip to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" module.json module.zip --clobber
